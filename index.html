<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBin - Login</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Custom color variables */
        :root {
            --primary-dark: #013220;
            --primary-medium: #0B6E4F;
            --primary-light: #50C878;
            --background-light: #D1F2EB;
        }

        /* Dark mode styles */
        .dark {
            background-color: var(--primary-dark);
            color: #ffffff;
        }
        .dark .bg-white {
            background-color: var(--primary-medium);
            color: #ffffff;
        }
        .dark .text-gray-900 {
            color: #ffffff;
        }
        .dark .text-gray-600 {
            color: #d1d1d1;
        }
        .dark .text-gray-500 {
            color: #a0a0a0;
        }
        .dark .border-gray-200 {
            border-color: var(--primary-medium);
        }
        .dark .shadow-md {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .dark .bg-swachh-800 {
            background-color: var(--primary-dark);
        }
        .dark .hover\:bg-swachh-700:hover {
            background-color: var(--primary-medium);
        }
        .dark .bg-gray-50 {
            background-color: var(--primary-dark);
        }
        .dark .bg-gray-100 {
            background-color: var(--primary-medium);
        }
        .dark .text-gray-800 {
            color: #ffffff;
        }

        /* Light mode styles */
        .bg-swachh-800 {
            background-color: var(--primary-dark);
        }
        .hover\:bg-swachh-700:hover {
            background-color: var(--primary-medium);
        }
        .bg-swachh-700 {
            background-color: var(--primary-medium);
        }
        .bg-swachh-600 {
            background-color: var(--primary-light);
        }
        .text-swachh-600 {
            color: var(--primary-light);
        }
        .bg-swachh-100 {
            background-color: var(--background-light);
        }
        .text-swachh-800 {
            color: var(--primary-dark);
        }
        .border-swachh-600 {
            border-color: var(--primary-light);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-lg shadow-lg">
            <div class="text-center">
                <div class="flex items-center justify-center space-x-2">
                    <i class="fas fa-trash-alt text-4xl text-swachh-600"></i>
                    <h2 class="text-4xl font-extrabold text-swachh-800">EcoBin</h2>
                </div>
                <p class="mt-2 text-sm text-gray-600">Smart Waste Management System</p>
            </div>
            <form class="mt-8 space-y-6" id="loginForm">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="username" class="sr-only">Username</label>
                        <input id="username" name="username" type="text" required
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-swachh-500 focus:border-swachh-500 focus:z-10 sm:text-sm"
                            placeholder="Username">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" required
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-swachh-500 focus:border-swachh-500 focus:z-10 sm:text-sm"
                            placeholder="Password">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-swachh-600 hover:bg-swachh-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-swachh-500">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-sign-in-alt"></i>
                        </span>
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Simple validation - replace with your actual authentication logic
            if (username === 'admin' && password === 'admin') {
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid credentials. Please try again.');
            }
        });
    </script>
</body>
</html>
