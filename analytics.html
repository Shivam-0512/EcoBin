<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBin - Analytics</title>
    <link rel="stylesheet" href="./dist/enhanced-styles.css">
    <script src="./dist/ui-enhancements.js" defer></script>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom styles for notification */
        .notification-bar {
            background-color: #D1F2EB;
            color: #013220;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0.25rem;
            display: none;
        }
        
        /* Add this new CSS for sidebar */
        @media (min-width: 768px) {
            .bg-swachh-800 {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
        }
        
        /* Dark mode styles */
        .dark {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .dark .bg-white {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        .dark .text-gray-900 {
            color: #ffffff;
        }
        .dark .text-gray-600 {
            color: #d1d1d1;
        }
        .dark .text-gray-500 {
            color: #a0a0a0;
        }
        .dark .border-gray-200 {
            border-color: #404040;
        }
        .dark .shadow-md {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .dark .bg-swachh-800 {
            background-color: #1a1a1a;
        }
        .dark .hover\:bg-swachh-700:hover {
            background-color: #2d2d2d;
        }
        .dark .bg-gray-50 {
            background-color: #1a1a1a;
        }
        .dark .bg-gray-100 {
            background-color: #2d2d2d;
        }
        .dark .text-gray-800 {
            color: #ffffff;
        }

        /* Light mode styles */
        .bg-swachh-800 {
            background-color: #013220;
        }
        .hover\:bg-swachh-700:hover {
            background-color: #0B6E4F;
        }
        .bg-swachh-700 {
            background-color: #0B6E4F;
        }
        .bg-swachh-600 {
            background-color: #50C878;
        }
        .text-swachh-600 {
            color: #50C878;
        }
        .bg-swachh-100 {
            background-color: #D1F2EB;
        }
        .text-swachh-800 {
            color: #013220;
        }
        .border-swachh-600 {
            border-color: #50C878;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="min-h-screen flex">
        <div class="bg-swachh-800 text-white w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out">
            <div class="flex items-center space-x-2 px-4">
                <i class="fas fa-trash-alt text-2xl"></i>
                <span class="text-2xl font-extrabold">EcoBin</span>
            </div>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-swachh-700 hover:text-white">
                    <i class="fas fa-home mr-2"></i>Dashboard
                </a>
                <a href="bin-locations.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-swachh-700 hover:text-white">
                    <i class="fas fa-map-marker-alt mr-2"></i>Bin Locations
                </a>
                <a href="workers.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-swachh-700 hover:text-white">
                    <i class="fas fa-users mr-2"></i>Workers
                </a>
                <a href="analytics.html" class="block py-2.5 px-4 rounded transition duration-200 bg-swachh-700">
                    <i class="fas fa-chart-bar mr-2"></i>Analytics
                </a>
                <a href="settings.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-swachh-700 hover:text-white">
                    <i class="fas fa-cog mr-2"></i>Settings
                </a>
            </nav>
        </div>

        <div class="flex-1">
            <div class="bg-white shadow-lg">
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center space-x-4">
                        <button class="md:hidden text-gray-500 hover:text-gray-600">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <a href="settings.html" class="flex items-center space-x-2 hover:text-swachh-600 transition-colors duration-200">
                            <span class="text-gray-800">Admin User</span>
                            <img class="h-8 w-8 rounded-full" src="https://ui-avatars.com/api/?name=Admin+User&background=22c55e&color=fff" alt="Admin">
                        </a>
                        <button id="logoutBtn" class="text-gray-600 hover:text-red-500 transition-colors duration-200">
                            <i class="fas fa-sign-out-alt text-xl"></i>
                        </button>
                        <div>
                            <button id="themeToggle" class="text-gray-600 hover:text-swachh-600 transition-colors duration-200">
                               
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <h1 class="text-2xl font-semibold text-gray-900 mb-6">Analytics</h1>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <!-- Bin Status Map -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-semibold text-gray-900 mb-4">Bin Status Map</h2>
                        <div id="map" class="h-[400px] w-full rounded-lg overflow-hidden" style="min-height: 400px;"></div>
                    </div>

                    <!-- Bin Status Summary -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-semibold text-gray-900 mb-4">Bin Status Summary</h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Bin ID</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Coordinates</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fill Level</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" id="binStatusTable">
                                    <!-- Bin rows will be populated here -->
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-200">
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700 font-medium">Total Bins</span>
                                <span class="font-semibold" id="totalBins">5</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Average Fill Time -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-semibold text-gray-900 mb-4">Average Fill Time</h2>
                        <div class="h-64">
                            <canvas id="fillTimeChart"></canvas>
                        </div>
                    </div>

                    <!-- Collection Per Day -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-semibold text-gray-900 mb-4">Collection Per Day</h2>
                        <div class="h-64">
                            <canvas id="collectionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize sidebar state
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.bg-swachh-800');
            if (window.innerWidth >= 768) { // md breakpoint
                sidebar.classList.remove('-translate-x-full');
            }
        });

        // Toggle sidebar on mobile
        document.querySelector('button').addEventListener('click', function () {
            document.querySelector('.bg-swachh-800').classList.toggle('-translate-x-full');
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function () {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        });

        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        
        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark'); // Keep this line for compatibility
            if (themeIcon) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.body.classList.toggle('dark'); // Keep this line for compatibility
            const isDark = document.documentElement.classList.contains('dark');
            
            // Update icon if it exists
            if (themeIcon) {
                if (isDark) {
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
            } else {
                // Just store the theme preference if no icon
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
        });
        
        // Replace the static bins array with a function to fetch from API
        // Sample bin data (replace with Firebase data later)
        // const bins = [
        //     { id: 'BIN001', location: 'Prayagraj Station', status: 'full', fillLevel: '95%', lat: 25.4358, lng: 81.8463 },
        //     { id: 'BIN002', location: 'Civil Lines', status: 'empty', fillLevel: '10%', lat: 25.4589, lng: 81.8523 },
        //     { id: 'BIN003', location: 'Katara', status: 'full', fillLevel: '100%', lat: 25.4422, lng: 81.8339 },
        //     { id: 'BIN004', location: 'George Town', status: 'empty', fillLevel: '5%', lat: 25.4497, lng: 81.8347 },
        //     { id: 'BIN005', location: 'Katra', status: 'full', fillLevel: '90%', lat: 25.4389, lng: 81.8456 }
        // ];
        
        // Fetch bins data from API
        async function fetchBins() {
            try {
                const response = await fetch('/api/bins');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching bins:', error);
                return [];
            }
        }
        
        // Initialize map
        async function initMap() {
            console.log("Initializing map...");
            
            // Fetch bins data
            const bins = await fetchBins();
            
            // Check if map container exists
            const mapContainer = document.getElementById('map');
            if (!mapContainer) {
                console.error("Map container not found!");
                return;
            }
            
            // Check if Leaflet is loaded
            if (typeof L === 'undefined') {
                console.error("Leaflet library not loaded!");
                return;
            }
            
            try {
                // Create the map
                const map = L.map('map').setView([25.4358, 81.8463], 13);
                console.log("Map created successfully");
                
                // Add the tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: ' OpenStreetMap contributors'
                }).addTo(map);
                console.log("Tile layer added successfully");
        
                // Add circle markers for each bin
                bins.forEach(bin => {
                    const color = bin.status === 'full' ? 'red' : 'green';
                    const radius = 100; // meters
                    
                    const circle = L.circle([bin.lat, bin.lng], {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.5,
                        radius: radius
                    }).addTo(map);
                    
                    circle.bindPopup(`
                        <strong>Bin ${bin.id}</strong><br>
                        Coordinates: ${bin.lat}, ${bin.lng}<br>
                        Status: ${bin.status}<br>
                        Fill Level: ${bin.fillLevel}%
                    `);
                });
                console.log("Circle markers added successfully");
                
                // Force a map refresh
                setTimeout(() => {
                    map.invalidateSize();
                    console.log("Map size invalidated");
                }, 200);
            } catch (error) {
                console.error("Error initializing map:", error);
            }
        }
        
        // Populate bin status table
        async function populateBinStatusTable() {
            // Fetch bins data
            const bins = await fetchBins();
            
            const tableBody = document.getElementById('binStatusTable');
            const totalBinsElement = document.getElementById('totalBins');
            
            if (!tableBody) {
                console.error('Bin status table not found');
                return;
            }
            
            tableBody.innerHTML = bins.map(bin => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">BIN${bin.id.toString().padStart(3, '0')}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${bin.lat}, ${bin.lng}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${bin.fillLevel}%</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            bin.status === 'full' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'
                        }">
                            ${bin.status}
                        </span>
                    </td>
                </tr>
            `).join('');
            
            if (totalBinsElement) {
                totalBinsElement.textContent = bins.length.toString();
            }
        }

        // Initialize charts
        function initCharts() {
            // Average Fill Time Chart
            const fillTimeCtx = document.getElementById('fillTimeChart').getContext('2d');
            const fillTimeChart = new Chart(fillTimeCtx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Average Fill Time (hours)',
                        data: [4.2, 3.8, 4.5, 3.9, 4.1, 3.7],
                        backgroundColor: 'rgba(34, 197, 94, 0.2)',
                        borderColor: 'rgba(34, 197, 94, 1)',
                        borderWidth: 2,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Hours'
                            }
                        }
                    }
                }
            });

            // Collection Per Day Chart
            const collectionCtx = document.getElementById('collectionChart').getContext('2d');
            const collectionChart = new Chart(collectionCtx, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Collections',
                        data: [12, 15, 10, 13, 11, 8, 5],
                        backgroundColor: 'rgba(34, 197, 94, 0.7)',
                        borderColor: 'rgba(34, 197, 94, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Collections'
                            }
                        }
                    }
                }
            });
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM content loaded");
            
            // Initialize the map with a delay to ensure the container is fully rendered
            setTimeout(() => {
                console.log("Initializing map after delay");
                initMap();
            }, 500);
            
            populateBinStatusTable();
            initCharts();
        });
        
        // Also initialize map when window loads (as a backup)
        window.addEventListener('load', function() {
            console.log("Window loaded");
            setTimeout(() => {
                console.log("Initializing map after window load");
                initMap();
            }, 1000);
        });
    </script>
</body>

</html>
